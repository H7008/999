        body {
            background-color: #0d0f17;
            color: #ffffff;
            text-align: center;
            padding-bottom: 50px;
        }

        /* بنر الصورة في الأعلى */
        .banner-container {
            position: relative;
            max-width: 1000px;
            margin: 20px auto 30px auto;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(229, 193, 88, 0.3);
            border: 2px solid rgba(229, 193, 88, 0.5);
        }

        .banner-image {
            width: 100%;
            height: auto;

        .whatsapp-link {

        }

        .section-title {
            color: #e5c158;
            margin-bottom: 25px;
            font-size: 22px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .exploit-btn {
            background: linear-gradient(145deg, #1f2536, #141824);
            color: #fff;
            border: 1px solid rgba(229, 193, 88, 0.4);
            padding: 16px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            text-decoration: none;
            transition: all 0.25s ease;
            display: block;
        }

        .exploit-btn:hover {
            transform: translateY(-3px);
            border-color: #e5c158;
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.4);
            background: linear-gradient(145deg, #e5c158, #c5a83a);
            color: #000;
        }

</head>
