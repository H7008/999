<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز الزعيم - تعديل وتهكير أجهزة بلايستيشن 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050507;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .banner-container {
            position: relative;
            max-width: 1200px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(229, 193, 88, 0.25);
            border: 1px solid rgba(229, 193, 88, 0.4);
        }

        /* عرض الصورة الأصلية بالكامل */
        .banner-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* جعل مكان رقم الواتساب بالأسفل قابلاً للضغط المباشر */
        .whatsapp-click-area {
            position: absolute;
            bottom: 1.5%;
            left: 33%;
            width: 34%;
            height: 8%;
            cursor: pointer;
            z-index: 10;
            text-decoration: none;
            /* حدد شفافية خفيفة عند الوقوف بالفأرة */
            border-radius: 20px;
            transition: 0.2s ease;
        }

        .whatsapp-click-area:hover {
            background-color: rgba(229, 193, 88, 0.15);
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.4);
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <!-- الصورة المرفوعة داخل المشروع -->
        <img src="banner.jpg" alt="مركز الزعيم - تعديل وتهكير أجهزة بلايستيشن 4" class="banner-image">

        <!-- رابط واتساب مباشر فوق موقع الرقم في الصورة -->
        <a href="https://wa.me/9647888721000" class="whatsapp-click-area" target="_blank" title="تواصل عبر واتساب"></a>
    </div>

</body>
</html>
